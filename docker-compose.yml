services:
  tr-auto:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD com pelo menos 10 caracteres}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY com pelo menos 32 caracteres}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TZ: America/Sao_Paulo
      DATA_DIR: /data
    expose:
      - "8000"
    volumes:
      - tr_auto_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  tr_auto_data:
